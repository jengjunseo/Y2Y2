name: Build Y2Y2

on:
  push:
    branches: [main, feature/v1-web-native]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Web / Gateway checks
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: Y2Y2-Web-Native
          path: public/v1-app.js
          if-no-files-found: error

  live-web-preview:
    if: github.event_name == 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Preview and exercise licensed media gateway
        env:
          PREVIEW_ORIGIN: https://y2-y2-git-feature-v1-web-native-wondaes-projects-fe5c826b.vercel.app
        run: |
          node <<'NODE'
          const origin = process.env.PREVIEW_ORIGIN;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          let health;
          for (let i = 0; i < 45; i++) {
            try {
              const r = await fetch(`${origin}/api/web?action=health`, { cache: 'no-store' });
              if (r.ok) { health = await r.json(); break; }
            } catch {}
            await sleep(2000);
          }
          if (!health?.ok) throw new Error('Vercel Preview web gateway did not become healthy');
          // Big Buck Bunny by Blender Foundation is CC BY 3.0. YouTube ID verified in public licensing metadata.
          const inspect = await fetch(`${origin}/api/web?action=inspect`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', origin },
            body: JSON.stringify({ url: 'https://www.youtube.com/watch?v=aqz-KE-bpKQ' })
          });
          const data = await inspect.json();
          if (!inspect.ok) throw new Error(`Live inspect failed: ${inspect.status} ${JSON.stringify(data)}`);
          const itag = data.audioPlan?.itag ?? data.mp4Plans?.[0]?.itag ?? data.mp4Plans?.[0]?.video?.itag;
          if (!itag) throw new Error('Live inspect returned no usable stream');
          const stream = await fetch(`${origin}/api/web?action=stream&videoId=${data.videoId}&itag=${itag}`, {
            headers: { origin, range: 'bytes=0-1023' }
          });
          if (stream.status !== 206) throw new Error(`Live range failed: ${stream.status} ${await stream.text()}`);
          const bytes = (await stream.arrayBuffer()).byteLength;
          if (bytes < 1 || bytes > 3500000) throw new Error(`Unexpected live range size: ${bytes}`);
          console.log(JSON.stringify({ health, videoId: data.videoId, title: data.title, itag, bytes }));
          NODE

  windows-engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: engine/windows/requirements.txt
      - name: Install engine dependencies
        run: python -m pip install -r engine/windows/requirements.txt pytest pyinstaller==6.21.0
      - name: Unit tests
        run: python -m pytest -q engine/windows/tests
      - name: Bundle Deno 2.8.1
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/download/v2.8.1/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          New-Item -ItemType Directory -Force -Path engine/windows/vendor | Out-Null
          Expand-Archive deno.zip -DestinationPath engine/windows/vendor -Force
          engine/windows/vendor/deno.exe --version
      - name: Build portable engine
        shell: pwsh
        run: |
          pyinstaller --clean --onefile --name Y2Y2-Engine-Windows-x64 `
            --paths "engine/windows" `
            --add-binary "engine/windows/vendor/deno.exe;." `
            --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all imageio_ffmpeg `
            engine/windows/y2y2_engine_v04.py
      - name: Portable engine protocol regression smoke
        shell: pwsh
        run: |
          $env:Y2Y2_APP_DATA_DIR = "$env:RUNNER_TEMP\y2y2-data"
          $env:Y2Y2_DOWNLOAD_DIR = "$env:RUNNER_TEMP\y2y2-downloads"
          $p = Start-Process -FilePath ".\dist\Y2Y2-Engine-Windows-x64.exe" -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $h = Invoke-RestMethod -Uri "http://127.0.0.1:49272/v1/health" -Headers @{ Origin = "https://y2-y2.vercel.app" }
                if ($h.protocolVersion -eq 1 -and $h.platform -eq "windows") { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "Engine health did not become ready" }
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:49272/v1/health" -Headers @{ Origin = "https://evil.example" } -ErrorAction Stop
              throw "Disallowed origin unexpectedly succeeded"
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw }
            }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

  android-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
